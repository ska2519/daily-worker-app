name: Autonomous AI Developer Agent

on:
  # 1. 낮/퇴근 직전: 이슈에 'agent-ready' 라벨이 붙었을 때 자동 실행
  issues:
    types: [labeled]

  # 2. 소통: 이슈나 PR 코멘트에 '@agent'가 멘션되었을 때 (봇 제외 안전장치 포함)
  issue_comment:
    types: [created]

  # 3. 퇴근 후 자동 실행: 매일 한국 시간 저녁 6시 (UTC 기준 오전 9시)
  schedule:
    - cron: '0 9 * * *'

  # 4. 수동 실행 (GitHub Actions 탭에서 [Run workflow] 버튼으로 즉시 테스트 가능)
  workflow_dispatch:

jobs:
  agent-task:
    # 실행 조건 필터링:
    # A) 'agent-ready' 라벨이 붙었을 때
    # B) 코멘트에 '@agent'가 포함되어 있고 작성자가 봇이 아닐 때
    # C) 저녁 스케줄러(schedule)나 수동 실행(workflow_dispatch)일 때
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'agent-ready') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@agent' ) && github.actor != 'dependabot[bot]' && github.actor != github.event.repository.owner.login == false) ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile
        
      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT_CONTEXT: ${{ github.event.issue.body || github.event.comment.body || '퇴근 후 자율 개발 대기 중인 이슈를 처리해줘.' }}
        run: |
          echo "=== Gemini AI 자율 에이전트 구동 시작 ==="
          # 임시로 패키지 설치 후 실행
          npm install @google/genai
          node -e '
            import("@google/genai").then(async ({ GoogleGenAI }) => {
              const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
              const prompt = process.env.PROMPT_CONTEXT;
              console.log("처리할 요청 사항:", prompt);
              
              // 여기에 Gemini API를 이용한 파일 분석/수정 로직을 작성할 수 있습니다.
              // 예: const response = await ai.models.generateContent({ model: "gemini-2.5-flash", contents: prompt });
              // console.log(response.text);
            });
          '

      - name: Verify Monorepo Build, Typecheck and Design Lint (CLAUDE.md Rules)
        run: |
          echo "=== CLAUDE.md 필수 검증 단계 실행 ==="
          pnpm turbo run build
          pnpm typecheck
          pnpm lint:design

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(agent): autonomous update for issue #${{ github.event.issue.number || 'evening-task' }}"
          title: "[AI-Dev Agent] 자동 생성된 작업 PR"
          body: |
            AI 에이전트가 `CLAUDE.md` 규칙과 빌드/타입/디자인 린트 검증을 모두 거쳐 생성한 PR입니다.
            변경 내역을 검토하고 머지해 주세요!
          branch: "ai-fix-agent-${{ github.event.issue.number || 'evening-task' }}"
          labels: "automerge"
