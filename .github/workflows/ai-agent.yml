name: Autonomous AI Developer Agent

on:
  # 1. 낮/퇴근 직전: 이슈에 'agent-ready' 라벨이 붙었을 때 자동 실행
  issues:
    types: [labeled]

  # 2. 소통: 이슈나 PR 코멘트에 '@agent'가 멘션되었을 때
  issue_comment:
    types: [created]

  # 3. 퇴근 후 자동 실행: 매일 한국 시간 저녁 6시 (UTC 기준 오전 9시)
  schedule:
    - cron: '0 9 * * *'

  # 4. 수동 실행 (GitHub Actions 탭에서 즉시 테스트 가능)
  workflow_dispatch:

jobs:
  agent-task:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'agent-ready') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@agent') && github.actor != 'dependabot[bot]') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run Gemini AI Developer Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT_CONTEXT: ${{ github.event.issue.body || github.event.comment.body || 'README.md에 프로젝트 소개 한 줄 추가하기' }}
        run: node .github/scripts/agent-runner.js

      - name: Verify Monorepo Build, Typecheck and Design Lint
        run: pnpm build

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat: autonomous agent applied changes based on issue"
          title: "🤖 Autonomous Agent Update"
          body: "Automated changes generated by Gemini AI Agent based on issue context."
          branch: agent-updates
          base: main
          delete-branch: true
