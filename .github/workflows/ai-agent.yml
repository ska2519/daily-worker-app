name: Autonomous AI Developer Agent

on:
  # 1. 낮/퇴근 직전: 이슈에 'agent-ready' 라벨이 붙었을 때 자동 실행
  issues:
    types: [labeled]

  # 2. 소통: 이슈나 PR 코멘트에 '@agent'가 멘션되었을 때
  issue_comment:
    types: [created]

  # 3. 퇴근 후 자동 실행: 매일 한국 시간 저녁 6시 (UTC 기준 오전 9시)
  schedule:
    - cron: '0 9 * * *'

  # 4. 수동 실행 (GitHub Actions 탭에서 즉시 테스트 가능)
  workflow_dispatch:

jobs:
  agent-task:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'agent-ready') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@agent') && github.actor != 'dependabot[bot]') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Gemini AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROMPT_CONTEXT: ${{ github.event.issue.body || github.event.comment.body || '퇴근 후 자율 개발 대기 중인 이슈를 처리해줘.' }}
        run: |
          echo "=== Gemini AI 자율 에이전트 구동 시작 ==="
          node -e '
            const https = require("https");
            const apiKey = process.env.GEMINI_API_KEY;
            const prompt = process.env.PROMPT_CONTEXT;
            
            console.log("전달받은 요구사항:", prompt);

            const data = JSON.stringify({
              contents: [{
                parts: [{
                  text: "당신은 전문 소프트웨어 개발 AI 에이전트입니다. 다음 이슈 내용을 분석하고 수행해야 할 작업을 안내해주세요: " + prompt
                }]
              }]
            });

            const req = https.request({
              hostname: "generativelanguage.googleapis.com",
              path: "/v1beta/models/gemini-2.5-flash:generateContent?key=" + apiKey,
              method: "POST",
              headers: { "Content-Type": "application/json" }
            }, (res) => {
              let body = "";
              res.on("data", (chunk) => body += chunk);
              res.on("end", () => {
                try {
                  const response = JSON.parse(body);
                  const resultText = response.candidates?.[0]?.content?.parts?.[0]?.text;
                  console.log("\n[Gemini AI 분석 결과]");
                  console.log(resultText || body);
                } catch (e) {
                  console.log("응답 파싱 완료:", body);
                }
              });
            });

            req.on("error", (e) => {
              console.error("API 요청 중 에러 발생:", e);
              process.exit(1);
            });

            req.write(data);
            req.end();
          '
